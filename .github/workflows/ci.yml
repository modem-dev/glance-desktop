name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Check (macOS ARM64)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint and type-check all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Check the speech helper
        working-directory: speech
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build native helpers and test video and OCR
        run: |
          /usr/bin/swiftc -target "$(uname -m)-apple-macosx15.0" -O native/video_encoder.swift -o target/glance-video-encoder
          /usr/bin/swiftc -target "$(uname -m)-apple-macosx15.0" -O native/video_frame.swift -o target/glance-video-frame
          /usr/bin/swiftc -target "$(uname -m)-apple-macosx15.0" -O native/ocr.swift -o target/glance-ocr
          cargo test --locked native_video_roundtrip -- --ignored
          cargo test --locked native_ocr_recognizes_synthetic_text_and_regions -- --ignored

  linux:
    name: Check (Linux x86_64, headless, ${{ matrix.part }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        # Lint, the rest of the suite and the editor's script runs, the longest part,
        # split over two, each in a job of its own so no job builds twice.
        part: [lint, tests, editor 1/2, editor 2/2]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    # Receipt (2026-11-22, lens-linux-ci-runs-near-60, s-963mn3): with an empty Rust
    # cache the slowest job took 25 min (tests: 12 to build, 12 to test, run 44965010214);
    # with main's cache the build takes about 1. Runners have varied by 1.5x, so 40 is
    # the tripwire.
    timeout-minutes: 40
    steps:
      - name: Install build and runtime dependencies
        run: |
          pacman -Syu --needed --noconfirm git rust clang cmake \
            fontconfig freetype2 libx11 libxcb libxkbcommon libxkbcommon-x11 \
            wayland vulkan-icd-loader vulkan-swrast ttf-dejavu ffmpeg
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Each part builds its own targets, so each keeps its own cache.
          key: ${{ startsWith(matrix.part, 'editor') && 'editor' || matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        if: matrix.part == 'lint'
        run: cargo fmt --check
      - name: Lint and type-check all targets
        if: matrix.part == 'lint'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        if: matrix.part == 'tests'
        run: cargo test --locked -- --skip every_script_holds
      - name: Test FFmpeg encode and frame decode
        if: matrix.part == 'tests'
        run: |
          cp native/linux/glance-video-* target/
          cargo test --locked native_video_roundtrip -- --ignored
      - name: Run the editor's scripts
        if: startsWith(matrix.part, 'editor')
        env:
          EDITOR_SHARD: ${{ matrix.part == 'editor 1/2' && '1/2' || '2/2' }}
        run: cargo test --locked --test editor every_script_holds
