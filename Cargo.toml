[package]
name = "glance"
version = "0.1.0"
edition = "2024"
description = "A native macOS screenshot editor for annotation, animated backdrops, and sharing visual context with coding agents."
license = "MIT"
repository = "https://github.com/modem-dev/glance-desktop"
homepage = "https://glance.sh"
readme = "README.md"
keywords = ["screenshot", "annotation", "macos", "gpui", "mcp"]
categories = ["multimedia::images", "gui"]
# Glance is distributed as a desktop app, not a crates.io package.
publish = false

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
image = "0.25"
imageproc = "0.27"
global-hotkey = "0.8"
arboard = "3.6"
smallvec = "1"
ab_glyph = "0.2"
async-channel = "2"
lyon = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
gif = "0.14"
color_quant = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.10"
sha2 = "0.11"
hkdf = "0.13"
aes-gcm = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27"
objc = "0.2"
block = "0.1"
metal = "0.33"

[dev-dependencies]
resvg = { version = "=0.48.1", default-features = false }
gpui = { version = "=0.2.2", features = ["test-support", "runtime_shaders"] }

[profile.release]
lto = "thin"
strip = true
